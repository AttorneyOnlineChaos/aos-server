[Options]
; The maximum number of players that can join the server at once.
max_players=100

; The port to listen for incoming connections on.
port=27000

; The server description that will appear on the master server.
server_description="This is a placeholder server description. Tell the world of AO who you are here!"

; The server name that will appear on the master server.
server_name="An Unnamed Server"

; The server's nickname. This appear in messages sent to users by the server.
; If not set, the server's name will be used instead.
server_nickname=""

; The server's Message of the Day. This will be sent in OOC to joining users.
motd="MOTD is not set."

; The amount of logged messages an area should store. Once this limit is reached, older messages will be overrwritten. 
; This is only used for modcall logging, or if the webhook_sendfile is enabled.
logbuffer=500

; The server logging type. Valid values here are "modcall","full" and "fullarea". 
; Modcall logging will only save an area log file if a modcall is sent. 
; Full logging will log every event in every area, and will output to a new file every day.
; FullArea logging will log every event in every area, seperating them into individual files and output to a new one every day.
logging=modcall

; The maximum number of statements that can be recorded in the testimony recorder.
maximum_statements=10

; The maximum number of connections that will be accepted from the same IP address.
; Multiclienting is generally used for casing/RPing, so the default value is fine in most cases.
multiclient_limit=15

; The maximum number of characters of a player name
maximum_name_length=30

; The maximum number of characters of a character name
maximum_ic_name_length=30

; The maximum number of characters an OOC message
maximum_text_length=256

; The maximum number of characters an IC message
maximum_ic_text_length=256

; The maximum number of characters of an evidence name
maximum_evidence_name_length=30

; The maximum number of characters of an evidence description
maximum_evidence_description_length=1024

; The maximum number of evidence an inventory can hold
max_inventory_size=100

; The maximum number of evidence a player's inventory can hold
max_personal_inventory_size=20

; The maximum size of a single packet in bytes; anything large disconnect the offender instanlty
max_packet_size=65536

; The maximum number of characters of a modcall
modcall_reason_limit=255

; The maximum number of /info replies allowed per addresses
info_rate_limit=100

; The amount of seconds a connection may idle without completing the handshake before it's dropped
handshake_timeout=10

; The number of pending connections the server may hold beyond the maximum amountof players
connection_headroom=20

; The amount of seconds a dropped player's session stays recoverable before it ends
; 0 = no session recovery
session_timeout=300

; The minimum time between game messages in areas, in miliseconds. The default value is fine for most cases.
message_floodguard=250

; The minimum time between game messages in the server, in miliseconds. Unlike message_floodguard, this timer is shared globally in the server.
global_message_floodguard=0

; If you send messages faster than this, you will be warned.
packet_rate_limit_soft=10

; If you send messages faster than this, you will be disconnected.
packet_rate_limit_hard=20

; The amount of seconds without interaction till a client is marked as AFK.
afk_timeout = 120

; The amount of seconds between two synchronisation passes (e.g. for example keeping timers synchronized between clients)
sync_interval = 5

; The URL of the server's remote repository, sent to the client during their initial handshake. Used by WebAO users for custom content.
asset_url=http://attorneyoffline.de/base/

[Advertiser]
; Options for the Masterserver.

; Whether or not the server should appear on the master server.
advertise=true

; The IP address of the master server. Unless something happens to the default one, you shouldn't change this.
ms_ip=https://servers.aceattorneyonline.com/servers

; Optional hostname of your server. Can either be an IP or a DNS name. Disables automatic IP detection of ms3.
hostname=

; Wether or not the server overwrites the advertised webao port to port 80 in order to utilise Cloudflare tunnels.
cloudflare_enabled=false

[Dice]
; The maximum number of sides dice can be rolled with.
max_value=100

; The maximum number of dice that can be rolled at once.
max_dice=100

[Moderation]
; The user ids that hold the SUPER role, separated by commas.
super_user_ids=

[Badge]
; The badges players may sign in with, at least one is needed.
;
; - cookie: Join without signing in.
; - password: Sign in using a password.
; - discord: Sign in with your Discord account.
; - gmail: Sign in with your Google account.
; - steam: Sign in with your Steam account.
;
; Single badge:
; ids=cookie
; Multiple badges:
; ids=steam,discord,cookie
ids=steam,cookie

; The directory badge plugins are loaded from.
plugins_directory=plugins

; The directory badge plugins keep their settings in
plugin_data_directory=config/badges

; The HTML page shown in the browser once a sign-in is succesful
auth_page=config/badges/auth.html

; Where the browser gets redirected after a sign-in: this server's public address, no path. https, or http only on localhost.
; discord: OAuth redirects in your app at https://discord.com/developers/applications
; gmail: OAuth redirects in your app at https://console.cloud.google.com/apis/credentials
; steam: nothing to register
redirect_origin=

; The amount of seconds a player's user token remains valid before they must sign in again.
user_token_ttl=604800

; The maximum number of challenge rounds a badge may be allowed
round_limit=8

; The amount of seconds a player is allowed to select a badge
select_timeout=60

; The amount of seconds a player is allowed to answer a challenge (e.g. a browser login)
challenge_timeout=300

; The number of login attempts an address gets before it is refused; a successful sign-in resets it.
challenge_attempts=3

; The amount of seconds over which the sign-in attempts are recovered.
challenge_attempt_window=3600
